name: build

on:
  # Branch pushes are covered by their pull request; build main directly.
  # A tag like v0.2.0 also publishes a GitHub Release with the installer.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-tests:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev qt6-tools-dev qt6-l10n-tools qt6-tools-dev-tools libgl-dev ninja-build \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev ffmpeg pkg-config \
            libmlt-dev libmlt++-dev libmlt-data
      # Phase 14b: speech recognition test (Vosk library + English model, and a
      # sentence spoken by espeak-ng; only for the tests, nothing is shipped from here).
      - name: Speech recognition test data
        run: |
          sudo apt-get install -y -qq espeak-ng unzip
          curl -sSL -o /tmp/vosk.zip https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-linux-x86_64-0.3.45.zip
          unzip -q /tmp/vosk.zip -d /tmp/vosk
          if curl -sSL --fail -o /tmp/model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip; then
            unzip -q /tmp/model.zip -d /tmp/models
            echo "BC_VOSK_MODEL=/tmp/models/vosk-model-small-en-us-0.15" >> "$GITHUB_ENV"
          fi
          espeak-ng -v en-us -s 130 -w /tmp/speech.wav "One two three four five. Hello world. This is a test."
          echo "BC_VOSK_LIB=/tmp/vosk/vosk-linux-x86_64-0.3.45/libvosk.so" >> "$GITHUB_ENV"
          echo "BC_SPEECH_WAV=/tmp/speech.wav" >> "$GITHUB_ENV"
      # Ubuntu's MLT is only used to run the tests here; the Windows package
      # ships its own MLT built from source with the LGPL parts only.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # Every menu command: enabled or not and why (the report of tests/tst_audit.cpp).
      - name: Menu command report
        run: |
          QT_QPA_PLATFORM=offscreen SDL_AUDIODRIVER=dummy build/tests/tst_audit 2>/dev/null | grep -E "AUDIT|UNEXPLAINED|commands run|dialogs closed" || true
      # The committed i18n/*.ts must hold exactly the texts lupdate finds in the code.
      - name: Translation files match the code
        run: |
          cp -r i18n /tmp/i18n_committed
          cmake --build build --target update_translations
          python3 tools/check_ts_sync.py /tmp/i18n_committed i18n
      # Phase 15a: the exported XML, OTIO and EDL read by the OpenTimelineIO reference library.
      - name: Interchange files read by OpenTimelineIO
        run: |
          BC_INTERCHANGE_OUT=/tmp/interchange QT_QPA_PLATFORM=offscreen SDL_AUDIODRIVER=dummy \
            build/tests/tst_phase15a writeSamplesForReferenceCheck
          python3 -m venv /tmp/otio
          /tmp/otio/bin/pip install -q opentimelineio otio-fcp-adapter otio-cmx3600-adapter
          /tmp/otio/bin/python tests/check_interchange.py /tmp/interchange
      # Phase 15b: files written by the OpenTimelineIO library imported by us.
      - name: OpenTimelineIO files imported
        run: |
          /tmp/otio/bin/python tests/make_interchange_refs.py /tmp/interchange_refs
          BC_INTERCHANGE_IN=/tmp/interchange_refs QT_QPA_PLATFORM=offscreen SDL_AUDIODRIVER=dummy \
            build/tests/tst_phase15b readReferenceFiles

  windows:
    name: Windows build, tests and installer
    runs-on: windows-latest
    permissions:
      contents: write   # only used when a v* tag publishes a release
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-dlfcn
            mingw-w64-ucrt-x86_64-libiconv
            git
            unzip

      - name: Download FFmpeg (LGPL shared build)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # BtbN/FFmpeg-Builds publishes LGPL-only builds (no x264/x265 or other GPL parts).
          $assets = (gh release view latest -R BtbN/FFmpeg-Builds --json assets | ConvertFrom-Json).assets
          # Pinned to the FFmpeg 8.1 release branch; BtbN only keeps the two newest branches,
          # so fall back to the newest numbered release branch (never "master").
          $asset = $assets | Where-Object { $_.name -match '^ffmpeg-n8\.1-latest-win64-lgpl-shared-8\.1\.zip$' } | Select-Object -First 1
          if (-not $asset) {
            $asset = $assets | Where-Object { $_.name -match '^ffmpeg-n\d+\.\d+-latest-win64-lgpl-shared-\d+\.\d+\.zip$' } |
                     Sort-Object { [version]($_.name -replace '^ffmpeg-n(\d+\.\d+)-.*$','$1') } -Descending | Select-Object -First 1
          }
          if (-not $asset) { $assets.name; throw "No LGPL shared win64 FFmpeg build found" }
          Write-Host "Using $($asset.name)"
          gh release download latest -R BtbN/FFmpeg-Builds -p $asset.name -D ffdl
          Expand-Archive "ffdl\$($asset.name)" -DestinationPath ffdl
          $root = Get-ChildItem ffdl -Directory | Select-Object -First 1
          Move-Item $root.FullName ffmpeg
          Get-ChildItem ffmpeg\bin
          Get-Content ffmpeg\LICENSE.txt -TotalCount 5

      - name: Build MLT video engine (LGPL parts only)
        run: |
          set -e
          git clone --depth 1 --branch v7.42.0 https://github.com/mltframework/mlt.git mlt-src
          # GPL modules are switched off; only core, avformat (FFmpeg) and sdl2 (sound) are built.
          cmake -S mlt-src -B mlt-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$(cygpath -m "$PWD/mlt")" \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$PWD/ffmpeg")" \
            -DGPL=OFF -DGPL3=OFF -DBUILD_TESTING=OFF -DCLANG_FORMAT=OFF -DBUILD_TESTS_WITH_QT6=OFF \
            -DUSE_AVDEVICE=OFF -DMOD_DECKLINK=OFF -DMOD_FREI0R=OFF -DMOD_GDK=OFF -DMOD_JACKRACK=OFF \
            -DUSE_LADSPA=OFF -DUSE_LV2=OFF -DUSE_VST2=OFF -DMOD_KDENLIVE=OFF -DMOD_MOVIT=OFF \
            -DMOD_OLDFILM=OFF -DMOD_PLACEBO=OFF -DMOD_PLUS=OFF -DMOD_RTAUDIO=OFF -DMOD_RNNOISE=OFF \
            -DMOD_SOX=OFF -DMOD_VORBIS=OFF -DMOD_XML=OFF -DMOD_NORMALIZE=OFF -DMOD_OPENFX=OFF \
            -DMOD_PLUSGPL=OFF -DMOD_QT6=OFF -DMOD_GLAXNIMATE_QT6=OFF -DMOD_RESAMPLE=OFF \
            -DMOD_RUBBERBAND=OFF -DMOD_VIDSTAB=OFF -DMOD_XINE=OFF -DMOD_SDL2=ON -DMOD_AVFORMAT=ON
          cmake --build mlt-build
          cmake --install mlt-build
          # WINDOWS_DEPLOY layout: DLLs in mlt/, modules in mlt/lib/mlt, data in mlt/share/mlt
          find mlt -maxdepth 3 | sort | head -60

      # Phase 14b: Vosk speech recognition (Apache 2.0, prebuilt libvosk.dll; shipped),
      # plus an English model and a sentence from Windows' own speech synthesizer for the test.
      - name: Download Vosk
        run: |
          set -e
          curl -sSL -o vosk.zip https://github.com/alphacep/vosk-api/releases/download/v0.3.45/vosk-win64-0.3.45.zip
          unzip -q vosk.zip -d vosk-dl
          # libvosk.dll is built with an older (msvcrt) C++ runtime than ours: it is loaded
          # only by BukharaSpeech.exe (static), with its own runtime DLLs next to it.
          mkdir -p vosk && cp -v vosk-dl/vosk-win64-0.3.45/*.dll vosk/
          echo "BC_VOSK_LIB=$(cygpath -m "$PWD/vosk/libvosk.dll")" >> "$GITHUB_ENV"
          if curl -sSL --fail -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip; then
            unzip -q model.zip -d models
            echo "BC_VOSK_MODEL=$(cygpath -m "$PWD/models/vosk-model-small-en-us-0.15")" >> "$GITHUB_ENV"
          fi

      - name: Spoken sentence for the speech test
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $wav = Join-Path $PWD 'speech.wav'
          $s.SetOutputToWaveFile($wav)
          $s.Rate = -1
          $s.Speak('One two three four five. Hello world. This is a test.')
          $s.Dispose()
          if (Test-Path $wav) { "BC_SPEECH_WAV=$($wav -replace '\\','/')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }

      - name: Read version
        id: ver
        run: |
          v=$(sed -n 's/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Configure
        run: |
          export PKG_CONFIG_PATH="$(cygpath -m "$PWD/mlt/lib/pkgconfig")"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFFMPEG_ROOT="$(cygpath -m "$PWD/ffmpeg")" -DBC_REQUIRE_LGPL_FFMPEG=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: |
          export PATH="$PWD/ffmpeg/bin:$PWD/mlt:$PATH"
          export BC_MLT_PREFIX="$(cygpath -m "$PWD/mlt")"
          export SDL_AUDIODRIVER=dummy
          if ! ctest --test-dir build --output-on-failure; then
            # Console output of a crashed test can be lost: run the failed
            # ones again with QtTest's own log file and show it.
            export QT_QPA_PLATFORM=offscreen
            for exe in build/tests/tst_*.exe; do
              rc=0; "$exe" -o "$exe.log,txt" > /dev/null 2>&1 || rc=$?
              if [ $rc -ne 0 ]; then echo "== $exe exit code $rc"; cat "$exe.log" || true; fi
            done
            exit 1
          fi

      - name: Deploy (exe + Qt DLLs + runtime DLLs + licenses)
        run: |
          set -e
          cmake --install build --prefix dist
          # Plug-ins run in this program (phase 15c-2): it must be in the package.
          test -f dist/BukharaPluginHost.exe
          # Speech recognition (phase 14b); its C++ runtime DLLs come from MSYS2 below.
          test -f dist/BukharaSpeech.exe
          mkdir -p dist/speech && cp -v vosk/*.dll dist/speech/
          # FFmpeg LGPL DLLs (not from MSYS2, so copied explicitly)
          cp -v ffmpeg/bin/av*.dll ffmpeg/bin/sw*.dll dist/
          mkdir -p dist/licenses/ffmpeg
          cp -v ffmpeg/LICENSE.txt dist/licenses/ffmpeg/
          # MLT (LGPL): libraries next to the exe, modules in lib/mlt, data in share/mlt
          cp -v mlt/*.dll dist/
          mkdir -p dist/lib dist/share
          cp -r mlt/lib/mlt dist/lib/mlt
          cp -r mlt/share/mlt dist/share/mlt
          mkdir -p dist/licenses/mlt
          cp -v mlt-src/COPYING dist/licenses/mlt/
          # Only these LGPL modules may be shipped.
          for m in dist/lib/mlt/*.dll; do
            case "$(basename "$m")" in
              libmltcore.dll|libmltavformat.dll|libmltsdl2.dll) ;;
              *) echo "Unexpected MLT module: $m"; exit 1 ;;
            esac
          done
          WDQ=$(command -v windeployqt6 || command -v windeployqt-qt6 || command -v windeployqt || true)
          if [ -z "$WDQ" ]; then WDQ=$(find /ucrt64 -iname 'windeployqt*.exe' | head -1); fi
          echo "windeployqt: $WDQ"
          "$WDQ" --release --no-translations --no-system-d3d-compiler --no-opengl-sw --compiler-runtime dist/BukharaCinema.exe
          # Copy every remaining MSYS2 DLL the exe, the Qt plugins and the MLT modules need.
          export PATH="$PWD/dist:$PATH"
          for pass in 1 2 3; do
            find dist -iname '*.exe' -o -iname '*.dll' | while read -r f; do
              ldd "$f" | awk '{print $3}' | grep -i '^/ucrt64/' || true
            done | sort -u | while read -r dll; do
              [ -f "dist/$(basename "$dll")" ] || cp -v "$dll" dist/
            done
          done
          # License list for every packaged DLL that comes from MSYS2.
          mkdir -p dist/licenses
          : > dist/licenses/components.txt
          for f in dist/*.dll; do
            b=$(basename "$f")
            pkg=$(pacman -Qqo "/ucrt64/bin/$b" 2>/dev/null || echo "?")
            if [ "$pkg" != "?" ]; then
              ver=$(pacman -Q "$pkg" | awk '{print $2}')
              lic=$(pacman -Qi "$pkg" | sed -n 's/^Licenses *: //p')
              short=${pkg#mingw-w64-ucrt-x86_64-}
              if [ -d "/ucrt64/share/licenses/$short" ]; then
                mkdir -p "dist/licenses/$short"
                cp -r "/ucrt64/share/licenses/$short/." "dist/licenses/$short/"
              fi
            else
              ver="-"; lic="see THIRD_PARTY.md"
            fi
            printf '%-40s %-45s %-20s %s\n' "$b" "$pkg" "$ver" "$lic" >> dist/licenses/components.txt
          done
          cat dist/licenses/components.txt
          # FFmpeg must be the LGPL build, never MSYS2's (GPL) one.
          if grep -i 'ffmpeg' dist/licenses/components.txt | grep -v ' - '; then
            echo "An MSYS2 FFmpeg DLL was packaged"; exit 1
          fi
          for f in dist/av*.dll dist/sw*.dll; do
            [ "$(sha256sum < "$f")" = "$(sha256sum < "ffmpeg/bin/$(basename "$f")")" ] || { echo "$f is not from the LGPL FFmpeg build"; exit 1; }
          done
          ls -R dist | head -80

      - name: Smoke test (start packaged app with a clean PATH)
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $p = Start-Process -FilePath "dist\BukharaCinema.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "App did not exit within 60 s" }
          if ($p.ExitCode -ne 0) { throw "App exited with code $($p.ExitCode) (missing DLL?)" }
          Write-Host "Smoke test passed"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.ver.outputs.version }}" `
            "/DSourceDir=${{ github.workspace }}\dist" `
            "/DOutDir=${{ github.workspace }}\out" `
            installer\bukhara-cinema.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Compress-Archive -Path dist\* -DestinationPath "out\BukharaCinema-portable-${{ steps.ver.outputs.version }}.zip"
          Get-ChildItem out

      - name: Publish release (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = (Get-ChildItem out\*).FullName
          # The release may already exist when it was created on github.com (which also creates the tag).
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --title "BUKHARA CINEMA $tag" `
              --notes "Windows 10/11 (64-bit). BukharaCinema-Setup-*.exe — installer; BukharaCinema-portable-*.zip — no installation needed." `
              --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: BukharaCinema-${{ steps.ver.outputs.version }}-windows
          path: out/*
          if-no-files-found: error
